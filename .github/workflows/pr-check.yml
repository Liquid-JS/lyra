name: PR check
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn lint:sass
  unit-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npx playwright install --with-deps chromium
      - run: yarn test
      - run: yarn test:schematics
  playground:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: yarn build:playground:wp
  docs:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: yarn docs:build
  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: yarn e2e:install
      - run: yarn e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
  smoke:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: smoke/.lib
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - name: Server-side rendering
        run: |
          npm run serve:ssr &
          sleep 5
          curl --fail --silent http://localhost:4000/ > page.html
          grep -q 'Lyra works!' page.html
          # The QR code is drawn on the server, so it's in the page before scripts run.
          grep -q '<nb-qr-code[^>]*><span[^>]*><svg' page.html
          # So is the markdown.
          grep -qE '<nb-markdown-viewer[^>]*><div class="uf-contents"[^>]*>(<!---->)*<h2[^>]*>Rendered markdown' page.html
          # With its code highlighted.
          grep -q '<span class="hljs-keyword">const</span>' page.html
          # The phone input names the number's country, whose names load on the server.
          grep -q 'aria-label="Country: United States of America"' page.html
          # A masked field shows its value formatted.
          grep -qE '<input[^>]*class="masked[^>]*value="\(201\) 555-0123"' page.html
          # The colour field shows its colour, with its swatch.
          grep -qE 'class="swatch"><span style="--nb-color-picker-swatch: ?rgb\(51, ?102, ?255\);?"></span>' page.html
          grep -qE '<input[^>]*value="#3366ff"[^>]*aria-label="Brand color"' page.html
