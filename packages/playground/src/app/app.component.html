<div class="toolbar"
    [class.tools-visible]="showToolbar()"
    dir="ltr">
    <button (click)="toggleToolbar()"
        [class.toolbar-toggle-fixed]="!showToolbar()"
        class="toolbar-toggle">
        {{ showToolbar() ? 'hide' : 'show' }} toolbar
    </button>
    @if (showToolbar()) {
    <span class="tools-divider"></span>
    <npg-layout-direction-toggle />
    <span class="tools-divider"></span>
    <npg-layout-theme-toggle />
    <span class="tools-divider"></span>
    <input #componentSearch
        type="text"
        placeholder="Components search (/)"
        (focus)="showComponentList()"
        (click)="showComponentList()"
        (input)="onSearchChange($event)"
        (keyup.enter)="navigateToComponent()" />
    @if (showComponentsList()) {
    <button (click)="hideComponentsList()"
        tabindex="-1"
        class="hide-components-list">hide list</button>
    <div class="component-list-wrapper">
        <npg-components-list [components]="components()" />
    </div>
    }
    }
</div>
<router-outlet />
