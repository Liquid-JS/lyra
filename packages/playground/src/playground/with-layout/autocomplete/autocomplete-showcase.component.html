<nb-card size="small">
  <nb-card-body>

    <input #autoInput
      nbInput
      type="text"
      (input)="onChange()"
      placeholder="Enter value"
      [nbAutocomplete]="auto" />

    <nb-autocomplete #auto
      (selectedChange)="onSelectionChange($event)">

      @for (option of filteredOptions(); track option) {
      <nb-option [value]="option">
        {{ option }}
      </nb-option>
      }

    </nb-autocomplete>

  </nb-card-body>
</nb-card>
