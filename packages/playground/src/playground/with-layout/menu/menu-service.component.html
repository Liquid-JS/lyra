<nb-card size="giant">
  <nb-menu tag="menu"
    [items]="menuItems" />
  <div class="control-panel">
    <router-outlet />
    <h3 class="h4">Selected item: {{ selectedItem() }}</h3>
    <button nbButton
      (click)="addMenuItem()">Add Menu Item</button>
    <button nbButton
      (click)="collapseAll()">Collapse all menu items</button>
    <button nbButton
      (click)="navigateHome()">Home</button>
    <button nbButton
      (click)="getSelectedItem()">Get Selected Item</button>
  </div>
</nb-card>
