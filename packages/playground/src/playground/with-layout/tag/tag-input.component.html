<nb-card>
  <nb-card-body>

    <nb-tag-list (tagRemove)="onTagRemove($event)">
      @for (tree of trees; track tree) {
      <nb-tag [text]="tree"
        removable />
      }
      <input type="text"
        nbTagInput
        (tagAdd)="onTagAdd($event)"
        fullWidth>
    </nb-tag-list>

  </nb-card-body>
</nb-card>
