<nb-card>
  <nb-card-body>

    <nb-form-field>
      <nb-tag-list (tagRemove)="onTagRemove($event)">
        @for (tag of tags; track tag) {
        <nb-tag [text]="tag"
          removable />
        }
        <input type="text"
          nbTagInput
          (tagAdd)="onTagAdd($event.value)"
          [nbAutocomplete]="autocomplete"
          fullWidth>
      </nb-tag-list>

      <nb-icon nbSuffix
        icon="search-outline"
        pack="icons" />
    </nb-form-field>

    <nb-autocomplete #autocomplete
      (selectedChange)="onTagAdd($event)">
      @for (option of options; track option) {
      <nb-option [value]="option">{{ option }}</nb-option>
      }
    </nb-autocomplete>

  </nb-card-body>
</nb-card>
