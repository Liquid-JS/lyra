<nb-card>
    <nb-card-body class="example-items-rows">
        <button nbButton
            status="basic"
            (click)="showToast('basic')">Basic</button>
        <button nbButton
            status="primary"
            (click)="showToast('primary')">Primary</button>
        <button nbButton
            status="success"
            (click)="showToast('success')">Success</button>
        <button nbButton
            status="info"
            (click)="showToast('info')">Info</button>
        <button nbButton
            status="warning"
            (click)="showToast('warning')">Warning</button>
        <button nbButton
            status="danger"
            (click)="showToast('danger')">Danger</button>
        <button nbButton
            status="control"
            (click)="showToast('control')">Control</button>
    </nb-card-body>
</nb-card>
