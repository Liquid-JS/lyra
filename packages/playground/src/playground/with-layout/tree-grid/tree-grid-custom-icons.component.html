<nb-card>
  <nb-card-body>
    <table [nbTreeGrid]="dataSource"
      [nbSort]="dataSource"
      equalColumnsWidth>
      <tr nbTreeGridHeaderRow
        *nbTreeGridHeaderRowDef="allColumns"></tr>
      <tr nbTreeGridRow
        *nbTreeGridRowDef="let row; columns: allColumns"></tr>

      <ng-container [nbTreeGridColumnDef]="customColumn">
        <th nbTreeGridHeaderCell
          *nbTreeGridHeaderCellDef
          nbSortHeader>
          {{ customColumn }}
          <span *nbSortHeaderIcon="let asc = isAscending; let desc = isDescending">
            @if (asc) {
            <nb-icon icon="chevron-down-outline"
              aria-label="sorted ascending" />
            }
            @if (desc) {
            <nb-icon icon="chevron-up-outline"
              aria-label="sorted descending" />
            }
          </span>
        </th>

        <td nbTreeGridCell
          *nbTreeGridCellDef="let row">
          @if (row.hasChildren()) {
          <button nbTreeGridRowToggle
            [attr.aria-label]="row.expanded ? 'collapse' : 'expand'">
            <nb-icon [icon]="row.expanded ? 'chevron-down-outline' : 'chevron-right-outline'"
              aria-hidden="true" />
          </button>
          }
          {{ row.data.name }}
        </td>
      </ng-container>

      @for (column of defaultColumns; track column) {
      <ng-container [nbTreeGridColumnDef]="column">
        <th nbTreeGridHeaderCell
          *nbTreeGridHeaderCellDef>{{ column }}</th>
        <td nbTreeGridCell
          *nbTreeGridCellDef="let row">{{ row.data[column] }}</td>
      </ng-container>
      }
    </table>
  </nb-card-body>
</nb-card>
