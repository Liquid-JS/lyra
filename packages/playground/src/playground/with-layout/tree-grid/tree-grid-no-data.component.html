<nb-card>
  <nb-card-body class="example-items-col">
    <input nbInput
      type="search"
      placeholder="Filter files"
      aria-label="Filter files"
      (input)="filter($event)" />

    <table [nbTreeGrid]="dataSource">
      <tr nbTreeGridHeaderRow
        *nbTreeGridHeaderRowDef="columns"></tr>
      <tr nbTreeGridRow
        *nbTreeGridRowDef="let row; columns: columns"></tr>
      <tr *nbTreeGridNoDataRowDef>
        <td nbTreeGridNoDataCell>No files match "{{ query() }}"</td>
      </tr>

      <ng-container nbTreeGridColumnDef="name">
        <th nbTreeGridHeaderCell
          *nbTreeGridHeaderCellDef>Name</th>
        <td nbTreeGridCell
          *nbTreeGridCellDef="let row">
          @if (row.data.kind === 'dir') {
          <nb-tree-grid-row-toggle [expanded]="row.expanded" />
          }
          {{ row.data.name }}
        </td>
      </ng-container>

      <ng-container nbTreeGridColumnDef="kind">
        <th nbTreeGridHeaderCell
          *nbTreeGridHeaderCellDef>Kind</th>
        <td nbTreeGridCell
          *nbTreeGridCellDef="let row">{{ row.data.kind }}</td>
      </ng-container>

      <ng-container nbTreeGridColumnDef="size">
        <th nbTreeGridHeaderCell
          *nbTreeGridHeaderCellDef>Size</th>
        <td nbTreeGridCell
          *nbTreeGridCellDef="let row">{{ row.data.size }}</td>
      </ng-container>
    </table>
  </nb-card-body>
</nb-card>
