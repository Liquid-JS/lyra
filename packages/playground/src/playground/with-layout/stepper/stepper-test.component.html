<nb-stepper>
  <nb-step [label]="labelOne">
    <ng-template #labelOne>First step</ng-template>
    <div class="step-container">
      <h3>Step content #1</h3>
      <button nbButton
        status="primary"
        disabled
        nbStepperPrevious>prev</button>
      <button nbButton
        status="primary"
        nbStepperNext>next</button>
    </div>
  </nb-step>
  <nb-step [label]="labelTwo">
    <ng-template #labelTwo>Second step</ng-template>
    <div class="step-container">
      <h3>Step content #2</h3>
      <button nbButton
        status="primary"
        nbStepperPrevious>prev</button>
      <button nbButton
        status="primary"
        nbStepperNext>next</button>
    </div>
  </nb-step>
  <nb-step label="Third step">
    <div class="step-container">
      <h3>Step content #3</h3>
      <button nbButton
        status="primary"
        nbStepperPrevious>prev</button>
      <button nbButton
        status="primary"
        nbStepperNext>next</button>
    </div>
  </nb-step>
  <nb-step [label]="labelFour">
    <ng-template #labelFour>Fourth step</ng-template>
    <div class="step-container">
      <h3>Step content #4</h3>
      <button nbButton
        status="primary"
        nbStepperPrevious>prev</button>
      <button nbButton
        status="primary"
        disabled
        nbStepperNext>next</button>
    </div>
  </nb-step>
</nb-stepper>
