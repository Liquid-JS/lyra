<nb-card>
  <nb-card-body class="example-items-col">
    <nb-form-field>
      <span nbPrefix
        dir="ltr">https://</span>
      <input type="text"
        nbInput
        placeholder="example.com"
        aria-label="Website" />
    </nb-form-field>

    <nb-form-field>
      <input type="number"
        nbInput
        value="90"
        aria-label="Rotation" />
      <span nbSuffix>deg</span>
    </nb-form-field>
  </nb-card-body>
</nb-card>
