<div class="cards">
    <nb-card>
        <img nbCardMedia
            src="assets/showcase/blog/team-meeting.webp"
            alt="A team meeting in a bright office" />
        <nb-card-body>An image at the top reaches the card's edges and covers its border.</nb-card-body>
    </nb-card>

    <nb-card>
        <div nbCardMedia
            class="block"
            aria-hidden="true">
            <nb-icon icon="pie-chart-outline" />
        </div>
        <nb-card-body>Any element can be media, e.g. a coloured block with an icon.</nb-card-body>
    </nb-card>

    <nb-card>
        <nb-card-body>Media can go at the bottom too.</nb-card-body>
        <img nbCardMedia="bottom"
            src="assets/showcase/blog/planning.webp"
            alt="Notes on a meeting table" />
    </nb-card>
</div>
