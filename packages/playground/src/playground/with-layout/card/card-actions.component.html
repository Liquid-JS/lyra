<nb-card>
  <nb-card-header>
    <h6>Profile</h6>
    <nb-card-actions>
      <button nbButton
        ghost
        status="basic"
        aria-label="Share">
        <nb-icon icon="share-outline" />
      </button>
      <button nbButton
        edge="end"
        ghost
        status="primary"
        aria-label="Edit">
        <nb-icon icon="edit-2-outline" />
      </button>
    </nb-card-actions>
  </nb-card-header>
  <nb-card-body>
    Ada Lovelace, ada&#64;example.com
  </nb-card-body>
  <nb-card-footer>
    <nb-card-actions>
      <button nbButton
        ghost
        size="small">Cancel</button>
      <button nbButton
        status="primary"
        size="small">Save</button>
    </nb-card-actions>
  </nb-card-footer>
</nb-card>
