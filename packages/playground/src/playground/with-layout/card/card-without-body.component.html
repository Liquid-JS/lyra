<nb-card [size]="'medium'">
  <nb-card-header>List inside nb-card-body</nb-card-header>
  <nb-card-body>
    <nb-list>
      @for (fruit of fruits; track fruit) {
      <nb-list-item>
        {{ fruit }}
      </nb-list-item>
      }
    </nb-list>
  </nb-card-body>
</nb-card>
