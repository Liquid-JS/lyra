<nb-card>
  <nb-card-body>
    <label id="phone-label"
      class="label">Phone</label>
    <nb-phone-input [(ngModel)]="phone"
      [(country)]="country"
      fullWidth
      aria-labelledby="phone-label" />
    <p class="paragraph">Value: <code>{{ phone() }}</code>, country: <code>{{ country() }}</code></p>
  </nb-card-body>
</nb-card>
