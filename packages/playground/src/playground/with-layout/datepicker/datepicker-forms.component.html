<nb-card size="large">
    <nb-card-body class="two-inputs">
        <input nbInput
            placeholder="Pick Date"
            [nbDatepicker]="formcontrol"
            [formControl]="formControl" />
        <nb-datepicker #formcontrol />

        <input nbInput
            placeholder="Form Picker"
            [nbDatepicker]="ngmodel"
            [(ngModel)]="ngModelDate" />
        <nb-datepicker #ngmodel />
    </nb-card-body>
</nb-card>
