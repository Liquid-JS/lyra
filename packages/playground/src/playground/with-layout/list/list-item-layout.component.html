<nb-card>
    <nb-list>
        @for (invoice of invoices; track invoice.id) {
        <nb-list-item>
            <nb-icon icon="file-text-outline" />
            <nb-list-item-title>
                <a nbListItemLink
                    routerLink="."
                    [queryParams]="{ invoice: invoice.id }">Invoice {{ invoice.id }}</a>
                <nb-list-item-description>Due {{ invoice.due }}, {{ invoice.amount }}</nb-list-item-description>
            </nb-list-item-title>
            <nb-list-item-actions>
                @if (invoice.paid) {
                <span class="caption">Paid</span>
                } @else {
                <button nbButton
                    edge="end"
                    ghost
                    size="small"
                    status="primary"
                    type="button"
                    (click)="paying.set(invoice.id)">Pay</button>
                }
            </nb-list-item-actions>
        </nb-list-item>
        }
    </nb-list>
</nb-card>

<p class="result">Opened: {{ opened() }}. Paying: {{ paying() }}.</p>
