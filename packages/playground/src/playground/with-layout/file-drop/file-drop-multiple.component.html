<nb-card>
  <nb-card-body>
    <label class="label"
      for="file-drop-documents">Documents</label>
    <nb-file-drop fullWidth
      id="file-drop-documents"
      multiple
      accept=".pdf"
      [maxSize]="1024 * 1024"
      [maxFiles]="3"
      prompt="Drop up to 3 PDFs, 1 MB each"
      [formControl]="documents"
      (rejected)="showRejected($event)" />
    @for (message of messages(); track $index) {
    <p class="caption status-danger">{{ message }}</p>
    }
  </nb-card-body>
</nb-card>
