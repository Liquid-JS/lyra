<nb-layout>
    <nb-layout-header fixed>
        <button nbButton
            status="success"
            size="tiny"
            (click)="toggle()">Toggle</button>
        <button nbButton
            status="info"
            size="tiny"
            (click)="toggleCompact()">Toggle Compact</button>
    </nb-layout-header>

    <nb-sidebar tag="left" />
    <nb-sidebar end
        tag="right" />

    <nb-layout-column class="colored-column-warning">Layout Content</nb-layout-column>
</nb-layout>
