<p class="greeting">Good morning, Jane</p>

<nb-form-field>
  <nb-icon nbPrefix
    icon="search-outline" />
  <input nbInput
    fullWidth
    type="search"
    placeholder="Search customers, notes…"
    aria-label="Search" />
</nb-form-field>

<div class="numbers">
  @for (item of numbers; track item.label) {
  <div class="number">
    <span class="tile"
      [class]="'tile status-' + item.status"><nb-icon [icon]="item.icon" /></span>
    <span class="value">{{ item.value }}</span>
    <span class="caption">{{ item.label }}</span>
  </div>
  }
</div>

<nb-card>
  <nb-card-header>Up next</nb-card-header>
  <nb-list>
    @for (meeting of meetings; track meeting.time) {
    <nb-list-item>
      <span class="time">{{ meeting.time }}</span>
      <span class="meeting">
        <span class="meeting-title">{{ meeting.title }}</span>
        <nb-user size="small"
          [picture]="avatar(meeting.with)"
          [name]="meeting.with"
          [title]="meeting.company" />
      </span>
    </nb-list-item>
    }
  </nb-list>
</nb-card>

<nb-card>
  <nb-card-header class="row">
    Tasks
    <a routerLink="../customers">See all</a>
  </nb-card-header>
  <nb-card-body class="tasks">
    @for (task of tasks; track task.title) {
    <nb-checkbox [checked]="task.done">{{ task.title }}</nb-checkbox>
    }
  </nb-card-body>
</nb-card>
