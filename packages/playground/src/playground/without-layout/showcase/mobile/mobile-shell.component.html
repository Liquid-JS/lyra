<nb-layout>
    <nb-layout-header fixed>
        @if (screen().back) {
        <a nbButton
            edge="start"
            ghost
            class="back"
            routerLink="customers"
            aria-label="Back to customers">
            <nb-icon icon="arrow-back-outline" />
        </a>
        }
        <h1 class="title">{{ screen().title }}</h1>
        <button nbButton
            edge="end"
            ghost
            class="action"
            type="button"
            aria-label="Notifications">
            <nb-icon icon="bell-outline" />
        </button>
    </nb-layout-header>

    <nb-layout-column>
        <router-outlet />
    </nb-layout-column>

    <nb-layout-footer fixed>
        <nav aria-label="Sections">
            <nb-route-tabset [tabs]="tabs"
                [activeLinkOptions]="{ exact: false }"
                outlet="false"
                appearance="bar" />
        </nav>
    </nb-layout-footer>
</nb-layout>
