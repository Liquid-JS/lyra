@if (frame === 'card') {
<nb-card>
  <nb-card-body>
    <ng-container *ngTemplateOutlet="content" />
  </nb-card-body>
</nb-card>
} @else {
<div class="plain">
  <ng-container *ngTemplateOutlet="content" />
</div>
}

<ng-template #content>
  <a class="brand"
    routerLink="../sign-in"><span class="logo"
      aria-hidden="true"></span> Acme</a>

  <header>
    <h1 class="h4">Forgot your password?</h1>
    <p>Enter your email and we'll send you a link to reset it</p>
  </header>

  <form (submit)="$event.preventDefault()">
    <div class="field">
      <label class="label"
        for="reset-email">Email</label>
      <input nbInput
        fullWidth
        id="reset-email"
        type="email"
        autocomplete="email"
        placeholder="you@example.com" />
    </div>
    <button nbButton
      fullWidth
      status="primary"
      type="submit">Send reset link</button>
  </form>

  <p class="footer"><a routerLink="../sign-in">Back to sign in</a></p>
</ng-template>
