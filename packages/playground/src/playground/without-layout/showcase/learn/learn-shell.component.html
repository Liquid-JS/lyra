<nb-layout>
    <nb-layout-header fixed>
        <a class="brand"
            routerLink="catalogue"><span class="logo"
                aria-hidden="true"></span>Acme <em>Learn</em></a>
        <nav class="sections"
            aria-label="Sections">
            <nb-route-tabset [tabs]="sections"
                outlet="false"
                collapse="menu"
                below="md" />
        </nav>
        <nb-form-field *nbShownAbove="'md'"
            class="search">
            <nb-icon nbPrefix
                icon="search-outline" />
            <input nbInput
                fullWidth
                type="search"
                placeholder="Search courses"
                aria-label="Search courses" />
        </nb-form-field>
        <div class="actions">
            <nb-user class="user"
                name="Jane Doe"
                title="Product designer"
                size="small"
                [onlyPicture]="phone()"
                [picture]="userPhoto"
                [nbContextMenu]="userMenu" />
        </div>
    </nb-layout-header>

    <nb-layout-column class="page">
        <router-outlet />
    </nb-layout-column>

    <nb-layout-footer>
        <p class="footer">
            <span>© {{ year }} Acme Learn</span>
            <a href="#"
                (click)="$event.preventDefault()">Help centre</a>
            <a href="#"
                (click)="$event.preventDefault()">Privacy</a>
            <a href="#"
                (click)="$event.preventDefault()">Terms</a>
        </p>
    </nb-layout-footer>
</nb-layout>
