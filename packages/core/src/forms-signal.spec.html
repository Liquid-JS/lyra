<nb-layout>
  <nb-layout-column>
    <nb-checkbox data-control="checkbox"
      [formField]="form.checkbox">Checkbox</nb-checkbox>
    <nb-toggle data-control="toggle"
      [formField]="form.toggle">Toggle</nb-toggle>
    <nb-radio-group data-control="radio"
      [formField]="form.radio">
      <nb-radio value="a">A</nb-radio>
      <nb-radio value="b">B</nb-radio>
    </nb-radio-group>
    <nb-select data-control="select"
      [formField]="form.select">
      <nb-option value="a">A</nb-option>
      <nb-option value="b">B</nb-option>
      <nb-option value="c">C</nb-option>
    </nb-select>
    <input nbInput
      data-control="autocomplete"
      [nbAutocomplete]="auto"
      [formField]="form.autocomplete" />
    <nb-autocomplete #auto>
      <nb-option value="a">a</nb-option>
      <nb-option value="b">b</nb-option>
    </nb-autocomplete>
    <input nbInput
      data-control="datepicker"
      [nbDatepicker]="datepicker"
      [formField]="form.datepicker" />
    <nb-datepicker #datepicker></nb-datepicker>
    <input nbInput
      data-control="timepicker"
      [nbTimepicker]="timepicker"
      [formField]="form.timepicker" />
    <nb-timepicker #timepicker></nb-timepicker>
    <input nbInput
      data-control="input"
      [formField]="form.input" />
    <input nbInput
      nbNumberInput
      scale="100"
      data-control="number"
      [formField]="form.number" />
    <textarea nbInput
      data-control="textarea"
      [formField]="form.textarea"></textarea>
  </nb-layout-column>
</nb-layout>
