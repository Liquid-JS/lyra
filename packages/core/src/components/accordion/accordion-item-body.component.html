<div #container
    class="item-body-container"
    [class.collapsed]="state() === 'collapsed'">
    <div class="item-body">
        <!-- nbAccordionItemBodyContent is lazy: it's created when the item is first expanded and then kept. -->
        @if (contentDirective(); as content) {
        @if (init()) {
        <ng-container [ngTemplateOutlet]="content.templateRef" />
        }
        } @else {
        <ng-content />
        }
    </div>
</div>
