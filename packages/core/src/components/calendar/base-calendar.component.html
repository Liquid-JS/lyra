<nb-card appearance="outline">
    @if (showNavigation()) {
    <nb-card-header class="calendar-navigation">
        <nb-calendar-view-mode [date]="shownDate()"
            [viewMode]="activeViewMode()"
            [changeable]="pickerMode() !== 'year'"
            (changeMode)="onChangeViewMode()" />
        <nb-calendar-pageable-navigation (prev)="navigatePrev()"
            (next)="navigateNext()" />
    </nb-card-header>
    }

    <nb-card-body>
        @switch (activeViewMode()) {
        @case (ViewMode.DATE) {
        <nb-calendar-day-picker [boundingMonths]="boundingMonth()"
            [cellComponent]="dayCellComponent()"
            [min]="min()"
            [max]="max()"
            [filter]="filter()"
            [visibleDate]="shownDate()"
            [size]="size()"
            [date]="date()"
            [showWeekNumber]="showWeekNumber()"
            [firstDayOfWeek]="firstDayOfWeek()"
            (dateChange)="dateChange.emit($any($event))"
            [weekNumberSymbol]="weekNumberSymbol()" />
        }
        @case (ViewMode.YEAR) {
        <nb-calendar-year-picker [cellComponent]="yearCellComponent()"
            [date]="$any(date())"
            [min]="min()"
            [max]="max()"
            [filter]="filter()"
            [size]="size()"
            [year]="shownDate()"
            (yearChange)="onYearPicked($event)" />
        }
        @case (ViewMode.MONTH) {
        <nb-calendar-month-picker [cellComponent]="monthCellComponent()"
            [min]="min()"
            [max]="max()"
            [filter]="filter()"
            [size]="size()"
            [month]="shownDate()"
            [date]="$any(date())"
            (monthChange)="onMonthPicked($event)" />
        }
        }
    </nb-card-body>

</nb-card>
