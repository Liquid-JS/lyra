<nb-layout>
  <nb-layout-header fixed>
    <div class="content-center">
      <ngd-header class="docs-header"
        [sidebarTag]="sidebarTag"
        [isDocs]="true" />
    </div>
  </nb-layout-header>
  <nb-sidebar class="menu-sidebar"
    [tag]="sidebarTag"
    [responsive]="true"
    [compactedBreakpoints]="[]"
    [collapsedBreakpoints]="collapsedBreakpoints">
    <nb-menu [items]="menuItems"
      tag="leftMenu" />
  </nb-sidebar>
  <nb-layout-column>
    <router-outlet />

    <div class="contact-us">
      <h2>Need some help or found an issue?</h2>
      <p>
        Start a discussion or open an issue on <a href="https://github.com/Liquid-JS/lyra/issues/new">GitHub</a>.
      </p>
    </div>
  </nb-layout-column>
  <nb-layout-footer>
    <ngd-footer />
  </nb-layout-footer>
</nb-layout>
