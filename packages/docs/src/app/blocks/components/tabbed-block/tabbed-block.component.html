@for (component of source(); track component) {
@switch (currentTab()?.tab) {
@case ('overview') {
@if (hasOverview(component)) {
<ngd-overview-block [source]="component" />
}
}
@case ('theme') {
@if (hasTheme(component)) {
<ngd-styles-block [source]="component" />
}
}
@case ('api') {
@if (hasAPI(component)) {
<ngd-api-block [source]="component" />
}
}
@case ('examples') {
@if (hasExamples(component)) {
<ngd-examples-block [source]="component" />
}
}
}
}
