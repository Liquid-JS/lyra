<nb-card class="header-card">
  <nb-card-header>
    <h2 class="h4 page-heading">All Components</h2>
  </nb-card-header>
</nb-card>

<div class="components-list">
  @for (component of components; track component) {
  @if (component.group) {
  <h3 class="group-title h4">{{ component.name }}</h3>
  }
  @if (!component.group) {
  <div class="component-card-wrapper">
    <a class="component-navigate-link"
      [routerLink]="component.link">
      <nb-card [attr.title]="component.name">
        <nb-card-body>
          <img class="component-icon"
            src="assets/images/components/{{ component.icon }}"
            [attr.alt]="component.name">
          <label class="component-name">{{ component.name }}</label>
        </nb-card-body>
      </nb-card>
    </a>
  </div>
  }
  }
</div>
