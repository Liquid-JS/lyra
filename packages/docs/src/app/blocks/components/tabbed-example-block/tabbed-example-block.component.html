@if (hasViewSwitch()) {
<button type="button"
    class="btn action-item action-button"
    (click)="switchToLiveView()">
    <nb-icon icon="image-outline" />
    <span class="text">Live view</span>
</button>
}

<nb-tabset class="tabs-container">
    @for (example of examples(); track example) {
    <nb-tab tabTitle="{{ example.extension }}"
        [active]="example.active">
        <ngd-code-block [path]="example.path"
            [code]="example.code" />
    </nb-tab>
    }
</nb-tabset>
