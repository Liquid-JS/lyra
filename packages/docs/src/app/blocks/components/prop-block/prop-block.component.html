<h3>{{ name() }}</h3>
<!-- Scrolls sideways itself where the table is wider than the card, e.g. on a phone. -->
<div class="table-scroll">
  <table>
    <thead>
      <tr>
        <td width="25%">Name</td>
        <td width="20%">Type</td>
        <td>Description</td>
      </tr>
    </thead>
    <tbody>
      @for (prop of properties(); track prop) {
      <tr>
        <td>{{ prop.name }}</td>
        <td>@if (prop.type) {
          <code>{{ prop.type }}</code>
          }
        </td>
        <td>
          @if (prop.shortDescription) {
          <ngd-markdown description
            [markdown]="prop.shortDescription ?? ''" />
          }
          @if (prop.description) {
          <ngd-markdown description
            [markdown]="prop.description ?? ''" />
          }
        </td>
      </tr>
      }
    </tbody>
  </table>
</div>
