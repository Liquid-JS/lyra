@for (style of classStyles(); track style) {
<!-- Scrolls sideways itself where the table is wider than the card, e.g. on a phone. -->
<div class="table-scroll">
    <table class="striped">
        <thead>
            <tr>
                <td>Name</td>
                <td>Theme Variable</td>
                <td>Default Value</td>
                <td>Description</td>
            </tr>
        </thead>
        <tbody>
            @for (item of style; track item) {
            <tr>
                <td>{{ item.name }}</td>
                <td>{{ item.parent || '' }}</td>
                <td ngdColorSwatch>{{ item.value || 'unknown' }}</td>
                <td>
                    @if (item.description) {
                    <ngd-markdown description
                        [markdown]="item.description" />
                    }
                </td>
            </tr>
            }
        </tbody>
    </table>
</div>
}
