<nb-card [ngdFragment]="source().slag">
    <nb-card-body>
        @for (node of overview(); track node) {
        <ng-container class="description">
            @if (node.type === 'text') {
            @for (section of node.content; track section) {
            <ngd-markdown [markdown]="section.source" />
            }
            }
            @if (node.type === 'live-example') {
            <ngd-live-example-block [content]="node.content"
                class="widget-block" />
            }
            @if (node.type === 'inline-example') {
            <ngd-inline-example-block [content]="node.content"
                class="widget-block" />
            }
            @if (node.type === 'stacked-example') {
            <ngd-stacked-example-block [content]="node.content"
                class="widget-block" />
            }
        </ng-container>
        }
    </nb-card-body>
</nb-card>
