<div class="container">
  <div class="lines">
    @for (line of lines(); track line) {
    <span>{{ line }}</span>
    }
  </div>
  <pre><code [nxtHighlight]="visible()" [language]="language()"></code></pre>
  @if (copy()) {
  <button nbButton
    class="copy-button"
    ghost
    status="control"
    size="small"
    type="button"
    [attr.aria-label]="copied() ? 'Copied' : 'Copy the code'"
    [title]="copied() ? 'Copied' : 'Copy'"
    (click)="copyCode()">
    <nb-icon [icon]="copied() ? 'checkmark-outline' : 'copy-outline'" />
  </button>
  }
</div>
