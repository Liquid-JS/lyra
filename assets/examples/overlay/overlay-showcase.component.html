<ng-template #overlay>
    <nb-card>
        <nb-card-header>This is overlay</nb-card-header>
        <nb-card-body>
            <button nbButton
                status="success"
                (click)="dismissOverlay()">Dismiss overlay</button>
        </nb-card-body>
    </nb-card>
</ng-template>
<button nbButton
    status="primary"
    (click)="createOverlay()">Create overlay</button>
