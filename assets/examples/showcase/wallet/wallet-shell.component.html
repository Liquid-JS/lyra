<nb-layout>
    <nb-layout-header fixed>
        <a class="brand"
            [routerLink]="link('overview')">
            <span class="logo"
                aria-hidden="true"></span>
            Wallet
        </a>

        <nav *nbShownAbove="'md'"
            class="sections"
            aria-label="Sections">
            @for (section of sections; track section.path) {
            <a [routerLink]="link(section.path)"
                routerLinkActive="active"
                #active="routerLinkActive"
                [attr.aria-current]="active.isActive ? 'page' : null">{{ section.title }}</a>
            }
        </nav>

        <nb-actions>
            <nb-action icon="bell-outline"
                title="Notifications"
                badgeDot
                badgeStatus="danger" />
            <nb-action>
                <nb-user name="Jane Doe"
                    title="Personal account"
                    [picture]="userPhoto"
                    [nbContextMenu]="userMenu" />
            </nb-action>
        </nb-actions>
    </nb-layout-header>

    <nb-layout-column class="page">
        <router-outlet />
    </nb-layout-column>

    <nb-layout-footer *nbShownBelow="'md'"
        fixed>
        <nav aria-label="Sections">
            <nb-route-tabset [tabs]="tabs"
                [activeLinkOptions]="{ exact: false }"
                outlet="false"
                appearance="bar" />
        </nav>
    </nb-layout-footer>
</nb-layout>
