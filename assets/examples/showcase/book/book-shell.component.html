<nb-layout>
    <nb-layout-header fixed>
        <a class="brand"
            routerLink="home"><span class="logo"
                aria-hidden="true"></span>{{ studio.name }}</a>
        <nav class="sections"
            aria-label="Sections">
            <nb-route-tabset [tabs]="sections"
                outlet="false"
                collapse="menu"
                below="md"
                (tabChange)="scrollTo($event.fragment)" />
        </nav>
        <div class="actions">
            <a nbButton
                status="primary"
                routerLink="book">Book now</a>
        </div>
    </nb-layout-header>

    <nb-layout-column class="page">
        <router-outlet />
    </nb-layout-column>
</nb-layout>
