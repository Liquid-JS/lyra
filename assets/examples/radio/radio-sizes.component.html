<nb-card>
    <nb-card-body class="example-items-rows">
        @for (size of sizes; track size) {
        <nb-radio-group [name]="'radio-sizes-' + size"
            [size]="size"
            value="on"
            [attr.aria-label]="size">
            <nb-radio value="on">On</nb-radio>
            <nb-radio value="off">Off</nb-radio>
        </nb-radio-group>
        }
    </nb-card-body>
</nb-card>
