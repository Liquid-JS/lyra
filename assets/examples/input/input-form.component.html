<nb-card>
    <nb-card-body class="example-items-col">
        <input type="text"
            nbInput
            fullWidth
            fieldSize="small"
            placeholder="Input"
            [(ngModel)]="inputItemNgModel" />
        <textarea nbInput
            fullWidth
            placeholder="Textarea"
            [(ngModel)]="textareaItemNgModel"></textarea>
        <input type="text"
            nbInput
            fullWidth
            fieldSize="small"
            placeholder="Input"
            [formControl]="inputItemFormControl" />
        <textarea nbInput
            fullWidth
            placeholder="Textarea"
            [formControl]="textareaItemFormControl"> </textarea>
    </nb-card-body>
</nb-card>
