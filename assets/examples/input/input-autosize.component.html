<nb-card>
    <nb-card-body class="example-items-col">
        <label for="input-autosize-note">Note to the courier</label>
        <textarea nbInput
            fullWidth
            nbAutosize
            minRows="1"
            maxRows="6"
            id="input-autosize-note"
            placeholder="Leave it with the neighbour at number 12"></textarea>

        <label for="input-autosize-description">Description</label>
        <textarea nbInput
            fullWidth
            nbAutosize
            rows="3"
            id="input-autosize-description">A hand-thrown stoneware mug, glazed in sea green. Each one is a little different, as the glaze runs in the kiln. Holds 350 ml and goes in the dishwasher.</textarea>
    </nb-card-body>
</nb-card>
