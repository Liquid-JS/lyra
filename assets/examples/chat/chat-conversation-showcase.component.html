<nb-chat title="Jake"
    size="medium"
    status="warning">
    @for (message of messages; track message) {
    <nb-chat-message [type]="message.type"
        [message]="message.text"
        [reply]="message.reply"
        [sender]="message.user.name"
        [date]="message.date"
        [files]="message.files"
        [quote]="message.quote"
        [latitude]="message.latitude"
        [longitude]="message.longitude"
        [avatar]="message.user.avatar" />
    }
    <nb-chat-form (send)="sendMessage($event, 'Jake', 'http://www.reactiongifs.com/r/wnd1.gif', true)"
        [showButton]="false"
        dropFiles />
</nb-chat>
<nb-chat title="John"
    size="medium"
    status="success">
    @for (message of messages; track message) {
    <nb-chat-message [type]="message.type"
        [message]="message.text"
        [reply]="!message.reply"
        [sender]="message.user.name"
        [date]="message.date"
        [files]="message.files"
        [quote]="message.quote"
        [latitude]="message.latitude"
        [longitude]="message.longitude"
        [avatar]="message.user.avatar" />
    }
    <nb-chat-form (send)="sendMessage($event, 'John', 'https://i.gifer.com/no.gif', false)"
        [showButton]="false"
        dropFiles />
</nb-chat>
