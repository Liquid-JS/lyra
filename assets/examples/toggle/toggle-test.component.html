<nb-card>
    <nb-card-body class="example-items-col">
        <nb-toggle id="first" />
        <nb-toggle id="second"
            [checked]="true" />
        <nb-toggle id="disabled"
            [disabled]="true" />
        <nb-toggle [checked]="true"
            [disabled]="true" />
        <nb-toggle id="primary"
            status="primary" />
        <nb-toggle id="success"
            status="success" />
        <nb-toggle id="warning"
            status="warning" />
        <nb-toggle id="danger"
            status="danger" />
        <nb-toggle id="info"
            status="info" />
    </nb-card-body>
</nb-card>
