<nb-card size="small">
    <nb-card-body>
        <nb-form-field>
            <input [type]="getInputType()"
                nbInput />
            <button nbSuffix
                nbButton
                ghost
                (click)="toggleShowPassword()">
                <nb-icon [icon]="showPassword ? 'eye-outline' : 'eye-off-2-outline'"
                    pack="icons"
                    [attr.aria-label]="showPassword ? 'hide password' : 'show password'" />
            </button>
        </nb-form-field>
    </nb-card-body>
</nb-card>
